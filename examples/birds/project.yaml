# The WrenNet bird model (8 species + non-bird), shipped as audiomoth/firmware/bird/model.
# Running this project reproduces that package byte for byte in the Docker image (tests/test_birds_reproduction.sh).
# The int8 calibration and the device test windows use the committed calibration bundle: freely licensed xeno-canto
# clips (calibration/README.md, ATTRIBUTION.csv).
name: birds
checkpoint: ../../wrennet/best_distillation_model.pt

# names in the model's OUTPUT order (for this checkpoint: allowed_bird_classes of its training config)
classes: [Bubo bubo, Certhia familiaris, Apus apus, Certhia brachydactyla, Emberiza cia, Lophophanes cristatus,
          Periparus ater, Poecile montanus, non-bird]
negative: last          # the "nothing of interest" class: index, 'last' or 'none'

calibration:            # audio for the int8 calibration (first 3 s of each file, shuffled with a fixed seed)
  audio: [calibration/audio]
  count: 300
  eval: 100

test:                   # windows on which the device pipeline is compared with PyTorch
  audio: [calibration/audio]
  windows: 120

device:
  window_start: "07:00"
  window_minutes: 5
  hop_seconds: 3
  confidence: 50
