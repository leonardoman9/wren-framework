# BioDCASE 2026 TinyML development set: 10 European bird species (none of them among WrenNet's 8) + Background.
# The given Validation folder becomes the test split; validation is carved from Train (by file).
name: biodcase-wrennet-seed0
data:
  train: /Users/leonardomannini/Progetti/BioDCASE/2026/biodcase_model/BioDCASE2026_TinyML_Development_Dataset/Train
  validation: /Users/leonardomannini/Progetti/BioDCASE/2026/biodcase_model/BioDCASE2026_TinyML_Development_Dataset/Validation
  negative: Background
training:
  init: wrennet
  epochs: 120
  patience: 15
  seed: 0
calibration: {count: 300, eval: 100}
device: {window_start: "05:30", window_minutes: 10, hop_seconds: 3, confidence: 50}
